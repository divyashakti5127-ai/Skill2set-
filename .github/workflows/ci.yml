name: CI Build & Lint Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build
        env:
          GEMINI_API_KEY: "ci_dummy_key"
          JSEARCH_API_KEY: "ci_dummy_key"
          ADZUNA_APP_ID: "ci_dummy_id"
          ADZUNA_APP_KEY: "ci_dummy_key"
